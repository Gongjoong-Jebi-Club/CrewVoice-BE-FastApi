version: "3.9"

services:
  # 1. FastAPI AI 모델 서빙 서버
  fastapi-server:
    build:
      # FastAPI 프로젝트 경로를 지정합니다.
      context: ./CrewVoice-BE-FastApi
      dockerfile: Dockerfile
    container_name: crewvoice-fastapi-container
    ports:
      # 호스트의 8000번 포트를 컨테이너의 8000번 포트와 매핑합니다.
      - "8000:8000"
    networks:
      - crewvoice-network
    restart: always

  # 2. Spring Boot 메인 백엔드 서버 (템플릿)
  # Spring Boot 프로젝트가 있는 경로를 context에 맞게 수정해주세요.
  spring-boot-server:
    build:
      # Spring Boot 프로젝트 경로를 지정합니다.
      context: ./CrewVoice-BE-SpringBoot
      # 해당 경로에 있는 Dockerfile을 사용합니다.
      dockerfile: Dockerfile
    container_name: crewvoice-springboot-container
    ports:
      # 호스트의 8080번 포트를 컨테이너의 8080번 포트와 매핑합니다.
      - "8080:8080"
    depends_on:
      # DB 서비스가 있다면 여기에 추가하여 실행 순서를 보장할 수 있습니다.
      # - postgres-db 
    networks:
      - crewvoice-network
    restart: always
    # environment:
      # Spring Boot에서 사용할 환경 변수 (DB 정보 등)를 설정합니다.
      # - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/crewvoicedb

# 서비스들이 서로 통신할 수 있는 가상 네트워크를 생성합니다.
networks:
  crewvoice-network:
    driver: bridge