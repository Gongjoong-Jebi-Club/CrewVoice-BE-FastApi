[project]
name = "fastapi-init"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.9",
    # Speech Analysis Dependencies
    "azure-cognitiveservices-speech>=1.38.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "praat-parselmouth>=0.4.3",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.0",
    "openai>=1.0.0",
    # Optional NLP Dependencies (for AccentAnalyzer)
    "konlpy>=0.6.0",
    "nltk>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
