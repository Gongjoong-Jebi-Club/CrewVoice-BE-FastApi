# ========================================
# FastAPI 서브도메인 설정
# 파일 위치: /etc/nginx/sites-available/ai.crewvoice.cloud
# ========================================

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name ai.crewvoice.cloud;

    # Certbot을 위한 ACME 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 설정
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.crewvoice.cloud;

    # SSL 인증서 경로 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ai.crewvoice.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.crewvoice.cloud/privkey.pem;

    # SSL 설정 (권장 설정)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 최대 업로드 파일 크기 (50MB)
    client_max_body_size 50M;

    # 로그 설정
    access_log /var/log/nginx/fastapi-access.log;
    error_log /var/log/nginx/fastapi-error.log;

    # FastAPI로 프록시
    location / {
        proxy_pass http://127.0.0.1:8000;

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 (음성 분석은 오래 걸릴 수 있음)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 버퍼 설정
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 헬스체크 엔드포인트
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
